<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="متوازي">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/favicon.svg">
<title>تسجيل الدخول — متوازي</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=20261122b">
</head>
<body class="app">
<header class="app-header">
  <div class="app-header__inner">
    <a href="/" class="logo" aria-label="متوازي — الرئيسية">
      <span class="logo__symbol" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none"><path d="M7 23C7 15.268 13.268 9 21 9" stroke="#0F766E" stroke-width="3.5" stroke-linecap="round"/><path d="M11 27C11 19.268 17.268 13 25 13" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/><circle cx="21" cy="9" r="2.5" fill="#0F766E"/><circle cx="25" cy="13" r="2.5" fill="#F97316"/></svg>
      </span>
      <span class="logo__text">متوازي</span>
    </a>
    <nav class="app-header__actions" aria-label="روابط">
      <a href="/">الرئيسية</a>
    </nav>
  </div>
</header>

<main class="wrap wrap--narrow">
  <div class="card auth-card">
    <div class="auth-head">
      <h1 id="title">تسجيل الدخول</h1>
      <p>تابع طلبك وجدولك مع متوازي</p>
    </div>

    <button class="btn ghost btn--google" id="google" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span>الدخول بحساب Google</span>
    </button>

    <div class="divider">أو بالبريد</div>

    <form id="form" novalidate>
      <div id="nameRow" class="hidden">
        <label for="name">الاسم</label>
        <input id="name" type="text" autocomplete="name" maxlength="80">
      </div>

      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" required dir="ltr">

      <label for="pw">كلمة المرور</label>
      <input id="pw" type="password" autocomplete="current-password" minlength="6" required dir="ltr">

      <button class="btn" id="submit" type="submit">دخول</button>
    </form>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <div class="auth-links small">
      <button class="link-btn" id="toggle" type="button">ما عندك حساب؟ أنشئ حساباً</button>
      <button class="link-btn" id="forgot" type="button">نسيت كلمة المرور؟</button>
    </div>
  </div>
</main>

<footer class="app-footer">
  <div class="app-footer__inner">
    <span>© 2026 متوازي</span>
    <nav aria-label="روابط قانونية"><a href="/terms">الشروط والأحكام</a><a href="/privacy">سياسة الخصوصية</a></nav>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/firebase-config.js"></script>
<script src="/auth.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var mode = "in";   // in | up
  var busy = false;

  /* وجهة ما بعد الدخول: مسار داخلي فقط (منع إعادة التوجيه لموقع خارجي) */
  function nextUrl() {
    var n = new URLSearchParams(location.search).get("next") || "";
    return /^\/[a-z0-9\-\/#?=&]*$/i.test(n) && n.indexOf("//") !== 0 ? n : "/account";
  }

  function say(text, kind) {
    var m = $("msg");
    m.textContent = text || "";
    m.className = "msg" + (kind ? " " + kind : "");
  }

  var ERRORS = {
    "auth/invalid-email": "البريد غير صحيح.",
    "auth/missing-password": "اكتب كلمة المرور.",
    "auth/weak-password": "كلمة المرور قصيرة — ٦ أحرف على الأقل.",
    "auth/email-already-in-use": "هذا البريد مسجّل — جرّب تسجيل الدخول.",
    "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة.",
    "auth/wrong-password": "البريد أو كلمة المرور غير صحيحة.",
    "auth/user-not-found": "البريد أو كلمة المرور غير صحيحة.",
    "auth/too-many-requests": "محاولات كثيرة — انتظر شوي وجرّب مرة ثانية.",
    "auth/popup-closed-by-user": "انقفلت نافذة Google قبل ما يكتمل الدخول.",
    "auth/popup-blocked": "المتصفح منع نافذة Google — اسمح بالنوافذ المنبثقة وجرّب مرة ثانية.",
    "auth/unauthorized-domain": "هذا الدومين غير مضاف في إعدادات الدخول بـ Firebase.",
    "auth/operation-not-allowed": "طريقة الدخول هذي غير مفعّلة حالياً.",
    "auth/network-request-failed": "تعذّر الاتصال — تأكد من الإنترنت."
  };
  function errText(e) { return ERRORS[e && e.code] || "صار خطأ، حاول مرة ثانية."; }

  function setMode(m) {
    mode = m;
    var up = m === "up";
    $("title").textContent = up ? "إنشاء حساب" : "تسجيل الدخول";
    $("submit").textContent = up ? "إنشاء الحساب" : "دخول";
    $("nameRow").classList.toggle("hidden", !up);
    $("pw").setAttribute("autocomplete", up ? "new-password" : "current-password");
    $("toggle").textContent = up ? "عندك حساب؟ سجّل دخولك" : "ما عندك حساب؟ أنشئ حساباً";
    say("");
  }

  function guard() {
    if (!Auth.ready) { say("الدخول غير متاح حالياً.", "err"); return false; }
    return !busy;
  }

  function run(p) {
    busy = true;
    $("submit").disabled = true;
    $("google").disabled = true;
    return p.then(function () {
      location.replace(nextUrl());
    }).catch(function (e) {
      say(errText(e), "err");
    }).then(function () {
      busy = false;
      $("submit").disabled = false;
      $("google").disabled = false;
    });
  }

  $("toggle").addEventListener("click", function () { setMode(mode === "in" ? "up" : "in"); });

  $("google").addEventListener("click", function () {
    if (!guard()) return;
    run(Auth.signInGoogle());
  });

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!guard()) return;
    var email = $("email").value.trim();
    var pw = $("pw").value;
    if (!email || !pw) { say("اكتب البريد وكلمة المرور.", "err"); return; }
    if (mode === "up") {
      var name = $("name").value.trim();
      if (!name) { say("اكتب اسمك.", "err"); return; }
      run(Auth.signUpEmail(name, email, pw));
    } else {
      run(Auth.signInEmail(email, pw));
    }
  });

  $("forgot").addEventListener("click", function () {
    if (!guard()) return;
    var email = $("email").value.trim();
    if (!email) { say("اكتب بريدك أولاً ثم اضغط «نسيت كلمة المرور».", "err"); return; }
    Auth.resetPassword(email).then(function () {
      say("إذا كان البريد مسجّلاً، بيوصلك رابط لتعيين كلمة مرور جديدة.", "ok");
    }).catch(function (e) { say(errText(e), "err"); });
  });

  /* مسجّل دخول أصلاً ⇒ مباشرة للوجهة */
  Auth.onChange(function (u) {
    if (u && !busy) location.replace(nextUrl());
  });
  /* auth.js يتهيّأ عند DOMContentLoaded — نفحص الجاهزية بعده */
  window.addEventListener("load", function () {
    if (!Auth.ready) say("الدخول غير متاح حالياً.", "err");
  });
})();
</script>
</body>
</html>
