# ============================================================
# متوازي · اختبار ونشر Firebase (الدوال + قواعد Firestore)
# ============================================================
# - كل push يمسّ الدوال أو القواعد ⇒ الاختبارات (منطق الدفع والتغذية،
#   وقواعد Firestore على المحاكي).
# - النشر: تلقائياً عند الدمج في main، أو يدوياً من تبويب Actions ←
#   «Run workflow» (من الجوال أيضاً). الإعداد: STACK.md.
# - النشر لا يتم إلا إذا نجحت الاختبارات.
# ============================================================
name: Firebase

on:
  push:
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "tests/**"
      - ".github/workflows/firebase.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # ما يُنشر. دوال الدفع (createPayment، moyasarWebhook) خارج القائمة حتى
  # تُضبط أسرار ميسر في Secret Manager — بدونها يفشل نشرها.
  # عند تجهيز الدفع: "firestore,functions"
  DEPLOY_TARGETS: "firestore,functions:submitIntake,functions:approvePlan"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: اختبارات الدوال (الدفع والتغذية)
        run: node functions/test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: اختبارات قواعد Firestore (المحاكي)
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-deploy
      cancel-in-progress: false
    steps:
      - name: التحقق من الإعداد
        id: cfg
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          if [ -z "$PROJECT" ] || [ "$HAS_SA" != "true" ]; then
            echo "::warning::النشر متوقف: أضف المتغير FIREBASE_PROJECT_ID والسر FIREBASE_SERVICE_ACCOUNT في إعدادات المستودع (STACK.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: تثبيت تبعيات الدوال
        if: steps.cfg.outputs.ready == 'true'
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - uses: google-github-actions/auth@v2
        if: steps.cfg.outputs.ready == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: النشر
        if: steps.cfg.outputs.ready == 'true'
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools@15 deploy \
            --only "$DEPLOY_TARGETS" \
            --project "$PROJECT" \
            --non-interactive --force
