<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ابدأ — متوازي</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">
  <div class="top">
    <a class="brand" href="/">متوازي</a>
    <a class="small" href="/account">حسابي</a>
  </div>

  <p class="msg" id="boot" role="status">جاري التحميل…</p>

  <div id="form" class="hidden">
    <div class="progress" aria-hidden="true"><span id="bar" style="width:0"></span></div>
    <div class="card">
      <div id="step"></div>
      <p class="field-err" id="err" role="alert" aria-live="assertive"></p>
      <div class="nav">
        <button class="btn ghost hidden" id="back" type="button">رجوع</button>
        <button class="btn" id="next" type="button">التالي</button>
      </div>
    </div>
    <p class="disclaimer">النتائج تختلف من شخص لآخر حسب الالتزام.</p>
  </div>

  <!-- أقل من السن المسموح (minAge في ملف الإعداد) -->
  <div id="tooYoung" class="card hidden">
    <h1 class="step-title">شكراً لاهتمامك بمتوازي</h1>
    <p>الخدمة حالياً متاحة للبالغين فقط.</p>
    <p class="muted">نتمنى لك كل خير، وإذا عندك أي سؤال عن الأكل الصحي، أهلك وطبيبك أفضل من يساعدك.</p>
    <a class="btn ghost" href="/">الرجوع للرئيسية</a>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<script src="/firebase-config.js"></script>
<script src="/auth.js"></script>
<script src="/start.js"></script>
</body>
</html>
